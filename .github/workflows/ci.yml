# Checks, the test servers with integration and end-to-end tests (task 14.2), and the installers
# for each platform, each installed and launched on a runner without Java (task 14.1).
#
# The release workflow (release.yml) runs this one with the version to build and the end-to-end
# tests on, and publishes only if it passes.
#
# The end-to-end tests are optional. They run when any of these holds:
# - the workflow is started by hand (Actions → CI → Run workflow) with "Run the end-to-end tests",
#   or run by the release workflow with its e2e option on (the default),
# - a pushed commit's message contains "[e2e]",
# - a pull request has the label "e2e",
# - the repository variable RUN_E2E is "true" (Settings → Secrets and variables → Actions).
name: CI

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      e2e:
        description: Run the end-to-end tests
        type: boolean
        default: true
  workflow_call:
    inputs:
      e2e:
        type: boolean
        default: true
      version:
        description: The version to build the installers with, instead of the one in package.json
        type: string
        default: ''

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # A choice made when starting the workflow (by hand or from release.yml) wins over the rest.
      RUN_E2E: ${{ inputs.e2e == true || (inputs.e2e == null && (contains(github.event.head_commit.message, '[e2e]') || contains(github.event.pull_request.labels.*.name, 'e2e') || vars.RUN_E2E == 'true')) }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: env.RUN_E2E == 'true'
        run: pnpm exec install-electron
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Start the test servers
        run: pnpm test:env:up
      - run: pnpm test:env:check
      - run: pnpm test:integration
      # Ubuntu 24.04 blocks the unprivileged user namespaces Chromium's sandbox needs.
      - if: env.RUN_E2E == 'true'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: End-to-end tests, including the smoke test
        if: env.RUN_E2E == 'true'
        run: xvfb-run -a pnpm test:e2e
      - name: Note skipped end-to-end tests
        if: env.RUN_E2E != 'true'
        run: |
          {
            echo '### End-to-end tests skipped'
            echo 'Run them by starting this workflow by hand, with "[e2e]" in a commit message,'
            echo 'with the label "e2e" on a pull request, or with the repository variable RUN_E2E=true.'
          } >> "$GITHUB_STEP_SUMMARY"
      - if: failure() && env.RUN_E2E == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: test-results/
      - if: always()
        run: pnpm test:env:down

  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            build: --mac dmg --arm64
          - os: windows-2025
            build: --win nsis --x64
          - os: ubuntu-24.04
            build: --linux AppImage deb --x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Set the release version
        if: inputs.version != ''
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: npm pkg set version="$VERSION"
      - run: pnpm build
      - run: pnpm exec electron-builder ${{ matrix.build }} --publish never
      - name: Install from the DMG and launch (macOS)
        if: runner.os == 'macOS'
        run: |
          mount=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" dist/*.dmg
          ditto "$mount/LDAP Studio.app" "$RUNNER_TEMP/LDAP Studio.app"
          hdiutil detach "$mount"
          command -v java || echo "java: none"
          node test/package/launch.mjs "$RUNNER_TEMP/LDAP Studio.app/Contents/MacOS/LDAP Studio"
      - name: Install with the NSIS installer and launch (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist -Filter '*-Setup-*-x64.exe' | Select-Object -First 1
          Start-Process -Wait -FilePath $installer.FullName -ArgumentList '/S'
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter 'LDAP Studio.exe' | Select-Object -First 1
          if (-not $exe) { throw 'LDAP Studio.exe was not installed' }
          if (Get-Command java -ErrorAction SilentlyContinue) { 'java: present' } else { 'java: none' }
          node test/package/launch.mjs $exe.FullName
      - name: Install the deb, run the AppImage, and launch both (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update
          sudo apt-get install -y xvfb ./dist/*.deb
          xvfb-run -a node test/package/launch.mjs "/opt/LDAP Studio/ldap-studio"
          chmod +x dist/*.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a node test/package/launch.mjs "$(ls dist/*.AppImage)"
      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
