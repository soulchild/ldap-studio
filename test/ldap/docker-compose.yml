# Integration test servers. Throwaway credentials; ports bound to localhost only.
name: ldap-studio-test

services:
  openldap:
    build: ./openldap
    ports:
      - '127.0.0.1:3389:389'
      - '127.0.0.1:3636:636'
    volumes:
      - ./certs/ca.crt:/certs/ca.crt:ro
      - ./certs/server.crt:/certs/server.crt:ro
      - ./certs/server.key:/certs/server.key:ro
      - openldap-data:/var/lib/openldap/openldap-data

  dirsrv:
    # The image only publishes `latest`, so it is pinned by digest.
    image: quay.io/389ds/dirsrv@sha256:f2851654c5df545cd893d84bea8d08c28dc25f0930493fbfed1d8a6eacf657f7
    environment:
      DS_DM_PASSWORD: admin-test-pw
      DS_SUFFIX_NAME: dc=example,dc=com
    ports:
      - '127.0.0.1:4389:3389'
      - '127.0.0.1:4636:3636'
    volumes:
      - dirsrv-data:/data
      - ./certs/dirsrv:/data/tls:ro
    healthcheck:
      test: ['CMD', '/usr/libexec/dirsrv/dscontainer', '-H']
      interval: 2s
      timeout: 5s
      retries: 60

# Named volumes keep the data when `up --build` recreates a container; `test:env:down` deletes them.
volumes:
  openldap-data:
  dirsrv-data:
