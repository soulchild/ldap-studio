# Test server only. Throwaway credentials.
include   /etc/openldap/schema/core.schema
include   /etc/openldap/schema/cosine.schema
include   /etc/openldap/schema/inetorgperson.schema
include   /etc/openldap/schema/nis.schema

modulepath /usr/lib/openldap
moduleload back_mdb.so

pidfile   /run/openldap/slapd.pid
argsfile  /run/openldap/slapd.args

TLSCACertificateFile   /certs/ca.crt
TLSCertificateFile     /certs/server.crt
TLSCertificateKeyFile  /certs/server.key

# uid=noschema cannot read the subschema entry, to test the schema fallback.
# Access to cn=Subschema is controlled by global ACLs, before any database section. Once a global
# ACL exists the implicit "read for everyone" default is gone, so the root DSE needs its own rule.
access to dn.base=""
  by * read
access to dn.base="cn=Subschema"
  by dn.exact="uid=noschema,ou=people,dc=example,dc=com" none
  by * read

database  mdb
maxsize   1073741824
suffix    "dc=example,dc=com"
rootdn    "cn=admin,dc=example,dc=com"
rootpw    admin-test-pw
directory /var/lib/openldap/openldap-data
index     objectClass eq
index     uid,cn,mail eq,sub

# A low size limit forces clients to page, like AD's MaxPageSize. The rootdn is exempt,
# so tests that need the limit bind as uid=reader. Paged searches may return everything.
limits users size.soft=100 size.hard=100 size.pr=unlimited size.prtotal=unlimited
limits anonymous size.soft=100 size.hard=100 size.pr=unlimited size.prtotal=unlimited

access to attrs=userPassword
  by self write
  by anonymous auth
  by * none

# Integration tests create containers named ou=it-*. uid=deleter may change and delete in them,
# except entries named cn=protected*, which lets tests make a subtree delete fail partway.
access to dn.regex="^cn=protected[^,]*,(.+,)?ou=it-[^,]+,dc=example,dc=com$"
  by * read
access to dn.regex="^(.+,)?ou=it-[^,]+,dc=example,dc=com$"
  by dn.exact="uid=deleter,ou=people,dc=example,dc=com" write
  by * read
access to dn.base="dc=example,dc=com" attrs=children
  by dn.exact="uid=deleter,ou=people,dc=example,dc=com" write
  by * read

access to *
  by * read
