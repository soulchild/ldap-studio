# git-cliff (https://git-cliff.org) writes CHANGELOG.md and the release notes from the commit
# subjects. Commits are plain sentences, not Conventional Commits, so they are grouped by their
# first word. Preview the next release with `pnpm changelog:preview`.

[changelog]
header = """
# Changelog

All notable changes to LDAP Studio.

"""
# The HTML comments only order the groups; striptags removes them from the output.
body = """
{% if version %}\
## {{ version | trim_start_matches(pat="v") }} ({{ timestamp | date(format="%Y-%m-%d") }})
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first | trim }}\
{% endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = false
filter_unconventional = false
commit_parsers = [
  # The release workflow's own version bump.
  { message = "^Release [0-9]", skip = true },
  { message = "^Initial commit", skip = true },
  { message = "^(Add|Support|Allow|Offer|Introduce)\\b", group = "<!-- 0 -->Added" },
  { message = "^Fix", group = "<!-- 2 -->Fixed" },
  { message = "^(Remove|Drop)\\b", group = "<!-- 3 -->Removed" },
  { message = ".*", group = "<!-- 1 -->Changed" },
]
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "newest"
